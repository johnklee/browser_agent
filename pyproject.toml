[project]
name = "browser-agent"
description = "An agent to facilitate browser automation and web scraping."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "John K. Lee", email = "puremonkey2007@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["browser", "agent", "scraper", "playwright", "crawler"]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "google-adk>=2.5.0",
    "html5lib>=1.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lxml>=5.0.0",
    "pandas>=2.0.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "tqdm>=4.70.0",
]

[project.urls]
Homepage = "https://github.com/johnklee/browser_agent"
Repository = "https://github.com/johnklee/browser_agent"
Issues = "https://github.com/johnklee/browser_agent/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/lab",
    "/labs",
    "/conductor",
]

[tool.hatch.version]
path = "browser_agent/__init__.py"

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "space"
